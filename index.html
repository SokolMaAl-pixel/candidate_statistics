<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>HR-Калькулятор GlavPro</title>
  <style>
    :root { --primary: #2c3e50; --success: #27ae60; --warning: #f39c12; --danger: #e74c3c; --accent: #3498db; --bg: #f4f7f6; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); padding: 20px; color: #333; line-height: 1.4; }
    .container { max-width: 1250px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .search-section { background: #eef2f3; padding: 15px; border-radius: 10px; display: grid; grid-template-columns: 1.5fr 1fr 1.5fr 1fr; gap: 15px; margin-bottom: 25px; align-items: end; border: 1px solid #d1d8dd; }
    .step-block { border: 1px solid #ddd; border-radius: 8px; margin-bottom: 12px; background: #fff; }
    .step-header { background: #f8f9fa; padding: 15px; cursor: pointer; display: flex; justify-content: space-between; font-weight: bold; border-radius: 8px; border-bottom: 1px solid #eee; }
    .step-content { display: none; padding: 20px; }
    .step-content.active { display: block; }
    .grid-row { display: grid; grid-template-columns: 1fr 1.6fr; gap: 30px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85em; color: #555; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; }
    .btn-find { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    .btn-save { background: var(--success); color: white; border: none; padding: 18px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 30px; }
    .sys-grade { font-weight: 800; padding: 6px 14px; border-radius: 4px; color: white; min-width: 45px; text-align: center; }
    .grade-D { background: var(--danger); } .grade-A { background: var(--success); }
  </style>
</head>
<body>
<div class="container" id="calculator-form">
  <h2>HR-Калькулятор GlavPro</h2>
  <div class="search-section">
    <div><label>Логин</label><input type="text" name="Логин" id="main_login" placeholder="ivanov_i"></div>
    <div><button class="btn-find" onclick="loadUserData()">🔍 Найти в таблице</button></div>
    <div><label>ФИО сотрудника</label><input type="text" name="ФИО_Сотрудника" id="user_fio"></div>
    <div><label>Дата старта</label><input type="date" name="Дата_Старта"></div>
  </div>
  <div class="step-block">
    <div class="step-header" onclick="toggleStep('d1')">ДЕНЬ 1: СТАРТ <span>▼</span></div>
    <div id="d1" class="step-content active">
      <div class="grid-row">
        <div>
          <label>Вызовы</label><input type="number" name="Д1_Вызовы" id="d1_calls" oninput="calcD1()">
          <label>Диалоги (ч)</label><input type="number" step="0.1" name="Д1_Диалоги" id="d1_time" oninput="calcD1()">
        </div>
        <div>
          <label>Комментарий:</label><textarea name="Д1_Комментарий"></textarea>
          <div style="margin-top:15px">Система: <span id="d1_sys" class="sys-grade grade-D">D</span></div>
        </div>
      </div>
    </div>
  </div>
  <button class="btn-save" onclick="sendData()">💾 СОХРАНИТЬ В ТАБЛИЦУ</button>
</div>
<script>
  const webAppUrl = 'https://script.google.com/macros/s/AKfycbzVIzIr2cbKNf7jjxL-JqvjJuqxS8NzmYjCh1kMLHzLKfyCR_eleZpN3zJVuR_nzxjfGw/exec';
  function toggleStep(id) {
    document.querySelectorAll('.step-content').forEach(c => c.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function loadUserData() {
    const login = document.getElementById('main_login').value.trim();
    if (!login) return alert('Введите логин!');
    fetch(`${webAppUrl}?login=${login}`).then(res => res.json()).then(data => {
      if (data.not_found) return alert('Сотрудник не найден.');
      document.querySelectorAll('#calculator-form input, #calculator-form textarea').forEach(input => {
        const name = input.name;
        if (data[name] !== undefined) input.value = data[name];
      });
      calcD1();
      alert('Данные загружены из таблицы!');
    }).catch(err => alert('Ошибка при поиске: ' + err));
  }
  function sendData() {
    const login = document.getElementById('main_login').value.trim();
    if (!login) return alert('Укажите Логин!');
    const data = { "Дата_Обновления": new Date().toLocaleString('ru-RU') };
    document.querySelectorAll('#calculator-form input, #calculator-form textarea').forEach(input => {
      const name = input.name;
      if (name) data[name] = input.value;
    });
    fetch(webAppUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) })
      .then(() => alert('Данные успешно сохранены!'));
  }
  function calcD1() {
    const calls = document.getElementById('d1_calls').value;
    const sys = document.getElementById('d1_sys');
    if (calls >= 20) { sys.innerText = 'A'; sys.className = 'sys-grade grade-A'; }
    else { sys.innerText = 'D'; sys.className = 'sys-grade grade-D'; }
  }
</script>
</body>
</html>
